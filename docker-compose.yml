services:
  postgres:
    image: postgres:16-alpine
    environment:
      POSTGRES_DB: ipo_quality_score
      POSTGRES_USER: ipo
      POSTGRES_PASSWORD: ipo
    ports:
      - "5432:5432"
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ipo -d ipo_quality_score"]
      interval: 5s
      timeout: 5s
      retries: 10
    volumes:
      - ipo_postgres_data:/var/lib/postgresql/data

  api:
    build:
      context: .
      dockerfile: backend/Dockerfile
    environment:
      IQS_DATABASE_URL: postgresql+psycopg://ipo:ipo@postgres:5432/ipo_quality_score
      IQS_AUTO_CREATE_SCHEMA: "false"
      IQS_IMPORT_REPORTS_ON_STARTUP: "false"
      IQS_CORS_ORIGINS: http://localhost:3000,http://localhost:5173
    command: >-
      sh -c "alembic -c backend/alembic.ini upgrade head &&
      python -m backend.cli import-reports &&
      uvicorn backend.app.main:app --host 0.0.0.0 --port 8000"
    ports:
      - "8000:8000"
    depends_on:
      postgres:
        condition: service_healthy

volumes:
  ipo_postgres_data:
