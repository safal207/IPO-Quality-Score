name: Backend

on:
  pull_request:
    paths:
      - "backend/**"
      - "reports/**"
      - "schema/**"
      - "scripts/**"
      - "docker-compose.yml"
      - ".github/workflows/backend.yml"
  push:
    branches:
      - main
    paths:
      - "backend/**"
      - "reports/**"
      - "schema/**"
      - "scripts/**"
      - "docker-compose.yml"
      - ".github/workflows/backend.yml"

permissions:
  contents: read

jobs:
  unit:
    runs-on: ubuntu-latest
    env:
      PYTHONPATH: .
    steps:
      - name: Check out repository
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip
          cache-dependency-path: backend/requirements-dev.txt

      - name: Install backend dependencies
        run: python -m pip install --quiet --requirement backend/requirements-dev.txt

      - name: Diagnose module import
        run: python -c "from backend.app.main import create_app; print('module-import-ok')"

      - name: Diagnose explicit settings
        run: python -c "from backend.app.config import Settings; print(Settings(database_url='sqlite:///./diagnostic.db', auto_create_schema=True))"

      - name: Diagnose application lifespan
        run: |
          python - <<'PY'
          from fastapi.testclient import TestClient
          from backend.app.config import PROJECT_ROOT, Settings
          from backend.app.main import create_app

          settings = Settings(
              database_url="sqlite:///./diagnostic.db",
              reports_root=PROJECT_ROOT / "reports",
              schema_path=PROJECT_ROOT / "schema" / "ipo-report.schema.json",
              auto_create_schema=True,
              import_reports_on_startup=True,
          )
          with TestClient(create_app(settings)):
              print("lifespan-ok")
          PY

      - name: Diagnose health request
        run: |
          python - <<'PY'
          from fastapi.testclient import TestClient
          from backend.app.config import PROJECT_ROOT, Settings
          from backend.app.main import create_app

          settings = Settings(
              database_url="sqlite:///./diagnostic-health.db",
              reports_root=PROJECT_ROOT / "reports",
              schema_path=PROJECT_ROOT / "schema" / "ipo-report.schema.json",
              auto_create_schema=True,
              import_reports_on_startup=True,
          )
          with TestClient(create_app(settings)) as client:
              response = client.get("/health")
              response.raise_for_status()
              print(response.json())
          PY

      - name: API health test on SQLite
        run: pytest backend/tests/test_backend.py::test_health_reports_imported -vv --tb=short

      - name: API list-filter test on SQLite
        run: pytest backend/tests/test_backend.py::test_list_reports_and_filter -q

      - name: API latest-report test on SQLite
        run: pytest backend/tests/test_backend.py::test_latest_report_by_ticker -q

      - name: API not-found test on SQLite
        run: pytest backend/tests/test_backend.py::test_report_not_found -q

      - name: API idempotent-import test on SQLite
        run: pytest backend/tests/test_backend.py::test_import_is_idempotent -q

      - name: Run migration and schema-drift tests on SQLite
        run: pytest backend/tests/test_migrations.py -q

  postgres:
    needs: unit
    runs-on: ubuntu-latest
    env:
      IQS_TEST_POSTGRES_URL: postgresql+psycopg://postgres:postgres@localhost:5432/ipo_quality_score
      PYTHONPATH: .
    services:
      postgres:
        image: postgres:16-alpine
        env:
          POSTGRES_DB: ipo_quality_score
          POSTGRES_USER: postgres
          POSTGRES_PASSWORD: postgres
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U postgres -d ipo_quality_score"
          --health-interval 5s
          --health-timeout 5s
          --health-retries 10
    steps:
      - name: Check out repository
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip
          cache-dependency-path: backend/requirements-dev.txt

      - name: Install backend dependencies
        run: python -m pip install --quiet --requirement backend/requirements-dev.txt

      - name: Run PostgreSQL migration and API integration
        run: pytest backend/tests/test_postgres_integration.py -q

      - name: Verify migration head
        env:
          IQS_DATABASE_URL: ${{ env.IQS_TEST_POSTGRES_URL }}
        run: alembic -c backend/alembic.ini current

      - name: Smoke-test idempotent PostgreSQL import
        run: python -m backend.cli import-reports --database-url "$IQS_TEST_POSTGRES_URL"
