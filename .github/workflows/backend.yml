name: Backend

on:
  pull_request:
    paths:
      - "backend/**"
      - "reports/**"
      - "schema/**"
      - "scripts/**"
      - ".github/workflows/backend.yml"
  push:
    branches:
      - main
    paths:
      - "backend/**"
      - "reports/**"
      - "schema/**"
      - "scripts/**"
      - ".github/workflows/backend.yml"

permissions:
  contents: read

jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - name: Check out repository
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip
          cache-dependency-path: backend/requirements-dev.txt

      - name: Install backend dependencies
        run: python -m pip install --requirement backend/requirements-dev.txt

      - name: Run backend tests
        env:
          PYTHONPATH: .
        run: pytest backend/tests -q

      - name: Smoke-test report import
        env:
          PYTHONPATH: .
        run: python -m backend.cli import-reports --database-url sqlite:///./backend-ci.db
