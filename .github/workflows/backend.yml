name: Backend

on:
  pull_request:
    paths:
      - "backend/**"
      - "reports/**"
      - "schema/**"
      - "scripts/**"
      - "docker-compose.yml"
      - ".github/workflows/backend.yml"
  push:
    branches:
      - main
    paths:
      - "backend/**"
      - "reports/**"
      - "schema/**"
      - "scripts/**"
      - "docker-compose.yml"
      - ".github/workflows/backend.yml"

permissions:
  contents: read

jobs:
  test:
    runs-on: ubuntu-latest
    env:
      IQS_TEST_POSTGRES_URL: postgresql+psycopg://postgres:postgres@localhost:5432/ipo_quality_score
    services:
      postgres:
        image: postgres:16-alpine
        env:
          POSTGRES_DB: ipo_quality_score
          POSTGRES_USER: postgres
          POSTGRES_PASSWORD: postgres
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U postgres -d ipo_quality_score"
          --health-interval 5s
          --health-timeout 5s
          --health-retries 10
    steps:
      - name: Check out repository
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip
          cache-dependency-path: backend/requirements-dev.txt

      - name: Install backend dependencies
        run: python -m pip install --requirement backend/requirements-dev.txt

      - name: Run SQLite and PostgreSQL tests
        env:
          PYTHONPATH: .
        run: pytest backend/tests -q

      - name: Verify migration head
        env:
          IQS_DATABASE_URL: ${{ env.IQS_TEST_POSTGRES_URL }}
        run: alembic -c backend/alembic.ini current

      - name: Smoke-test idempotent PostgreSQL import
        env:
          PYTHONPATH: .
        run: python -m backend.cli import-reports --database-url "$IQS_TEST_POSTGRES_URL"
