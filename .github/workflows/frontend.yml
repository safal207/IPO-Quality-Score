name: Frontend

on:
  pull_request:
    paths:
      - "frontend/**"
      - ".github/workflows/frontend.yml"
  push:
    branches:
      - main
    paths:
      - "frontend/**"
      - ".github/workflows/frontend.yml"

permissions:
  contents: read

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - name: Check out repository
        uses: actions/checkout@v4
        with:
          persist-credentials: false

      - name: Set up Node.js
        uses: actions/setup-node@v5
        with:
          node-version: "22.12.0"
          cache: npm
          cache-dependency-path: frontend/package-lock.json

      - name: Install locked frontend dependencies
        working-directory: frontend
        run: npm ci --no-audit --no-fund

      - name: Verify TypeScript 7
        working-directory: frontend
        run: npx tsc --version | grep '^Version 7\.'

      - name: Run runtime contract tests
        working-directory: frontend
        run: npx vitest run src/contracts.test.ts src/history-contract.test.ts --reporter=verbose

      - name: Run dashboard component tests
        working-directory: frontend
        run: npx vitest run src/App.test.tsx --reporter=verbose

      - name: Run interest loop component tests
        working-directory: frontend
        shell: bash
        run: |
          set -o pipefail
          npx vitest run src/interest-loop.test.tsx --reporter=verbose 2>&1 | tee interest-loop-test-output.txt

      - name: Upload interest loop test output
        if: failure()
        uses: actions/upload-artifact@v4
        with:
          name: interest-loop-test-output
          path: frontend/interest-loop-test-output.txt
          retention-days: 1

      - name: Type-check and build
        working-directory: frontend
        run: npm run build

      - name: Install Chromium
        working-directory: frontend
        run: npx playwright install --with-deps chromium

      - name: Run browser smoke test
        working-directory: frontend
        run: npm run test:e2e
